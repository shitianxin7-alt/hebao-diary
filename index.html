<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>荷包日记</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#edf5e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="荷包日记">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #edf5e9;
    --ink: #050505;
    --green: #195736;
    --yellow: #ffbf2e;
    --muted: #9ba1a5;
    --red: #e05a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    width: 100%;
    max-width: 440px;
    padding: 20px 18px 120px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- header ---------- */
  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; display: block; }
  .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .today-pill {
    border: 2px solid var(--green);
    border-radius: 32px;
    padding: 5px 14px 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
  }

  /* ---------- banner ---------- */
  .banner {
    background: var(--green);
    color: #fff;
    border-radius: 24px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .banner .num { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .banner .num small { font-size: 16px; font-weight: 700; margin-right: 2px; }
  .banner .label { font-size: 13px; opacity: .85; margin-top: 6px; }
  .banner .right { text-align: right; font-size: 13px; line-height: 1.8; opacity: .92; }
  .banner .right b { font-size: 15px; font-variant-numeric: tabular-nums; }

  /* ---------- tabs ---------- */
  .tabs {
    display: flex;
    background: #fff;
    border-radius: 32px;
    border: 2px solid var(--ink);
    padding: 4px;
    gap: 4px;
  }
  .tabs button {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 24px;
    padding: 9px 0 7px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tabs button.on { background: var(--green); color: #fff; }

  /* ---------- records ---------- */
  #listView.off, #statsView.off { display: none; }
  .day-group { margin-bottom: 14px; }
  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 6px 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .day-head b { color: var(--green); font-variant-numeric: tabular-nums; }
  .rec {
    background: #fff;
    border-radius: 18px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    border: 2px solid transparent;
    transition: transform .1s ease, opacity .2s ease;
  }
  .rec:active { transform: scale(.98); }
  .rec .emoji { font-size: 24px; width: 34px; text-align: center; flex-shrink: 0; }
  .rec .mid { flex: 1; min-width: 0; }
  .rec .cat { font-size: 15px; font-weight: 700; }
  .rec .note { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .amt { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rec .del {
    border: none;
    background: transparent;
    color: #d7dcd2;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    font-family: inherit;
  }
  .rec .del:active { color: var(--red); }
  .rec.gone { opacity: 0; transform: translateX(30px); }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; line-height: 2; }

  /* ---------- stats ---------- */
  .panel {
    background: #fff;
    border-radius: 24px;
    padding: 18px 16px 16px;
  }
  .panel h2 { font-size: 15px; font-weight: 800; margin-bottom: 14px; padding: 0 2px; }
  .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cat-row .emoji { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
  .cat-row .info { flex: 1; min-width: 0; }
  .cat-row .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .cat-row .top span:last-child { font-variant-numeric: tabular-nums; }
  .track { height: 10px; background: #eef2ea; border-radius: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--yellow); border-radius: 6px; transition: width .3s ease; }
  .cat-row.top1 .track i { background: var(--green); }

  /* ---------- tools ---------- */
  .tools { display: flex; gap: 10px; }
  .tools button {
    flex: 1;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 11px 0 9px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .tools button:active { transform: scale(.96); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom));
    width: min(404px, calc(100% - 36px));
    max-width: 440px;
    border: none;
    border-radius: 26px;
    padding: 17px 0 15px;
    background: var(--yellow);
    color: var(--ink);
    font-size: 18px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(5,5,5,.9);
    z-index: 50;
  }
  .fab:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 rgba(5,5,5,.9); }

  /* ---------- add sheet ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,5,5,.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .overlay.on { display: flex; }
  .sheet {
    background: var(--bg);
    border-radius: 28px 28px 0 0;
    width: 100%;
    max-width: 440px;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp .25s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .amt-display {
    text-align: center;
    font-size: 44px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    padding: 6px 0 10px;
    min-height: 66px;
  }
  .amt-display small { font-size: 22px; margin-right: 4px; }
  .amt-display .ph { color: #c9cfc4; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cats button {
    border: 2px solid #d7dcd2;
    background: #fff;
    border-radius: 18px;
    padding: 7px 12px 6px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    color: var(--ink);
  }
  .cats button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .note-input {
    width: 100%;
    border: 2px solid #d7dcd2;
    background: #fff;
    border-radius: 16px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
  }
  .note-input:focus { border-color: var(--green); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .pad button {
    border: none;
    background: #fff;
    border-radius: 16px;
    padding: 14px 0 12px;
    font-size: 22px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  .pad button:active { background: #e2ead9; }
  .pad .fn { font-size: 17px; color: var(--muted); }
  .sheet-row { display: flex; gap: 10px; }
  .sheet-row button {
    flex: 1;
    border: none;
    border-radius: 20px;
    padding: 15px 0 13px;
    font-size: 16px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  .sheet-row .btn-cancel { background: #fff; border: 2px solid var(--ink); }
  .sheet-row .btn-save { background: var(--yellow); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--ink);
    color: #fff;
    border-radius: 14px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 700;
    z-index: 200;
    transition: transform .25s ease;
    max-width: calc(100% - 40px);
  }
  .toast.on { transform: translateX(-50%) translateY(0); }
  .toast .undo { color: var(--yellow); margin-left: 10px; cursor: pointer; }

  .tip { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.8; }
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="7" y="14" width="34" height="24" rx="6" fill="#fff" stroke="#195736" stroke-width="2.6"/>
        <path d="M7 21h34" stroke="#195736" stroke-width="2.6"/>
        <rect x="30" y="26" width="8" height="6" rx="2" fill="#ffbf2e" stroke="#195736" stroke-width="2"/>
        <circle cx="20" cy="29" r="1.6" fill="#195736"/>
        <circle cx="25" cy="29" r="1.6" fill="#195736"/>
        <path d="M20.8 32.5c1.4 1.2 3 1.2 4.4 0" stroke="#195736" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="24" cy="9" r="5" fill="#ffbf2e" stroke="#195736" stroke-width="2.4"/>
        <path d="M24 6.8v4.4M22.4 9.6c0-1 .7-1.8 1.6-1.8s1.6.7 1.6 1.6-.7 1.4-1.6 1.4-1.6.6-1.6 1.5.7 1.5 1.6 1.5" stroke="#195736" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <h1>荷包日记</h1>
    </div>
    <div class="today-pill" id="todayPill"></div>
  </div>

  <div class="banner">
    <div>
      <div class="num" id="monthAmt"><small>¥</small>0</div>
      <div class="label">本月支出</div>
    </div>
    <div class="right">
      今天花了 <b id="todayAmt">¥0</b><br>
      本月 <b id="monthCnt">0</b> 笔 · 平均每天 <b id="dayAvg">¥0</b>
    </div>
  </div>

  <div class="tabs">
    <button id="tabList" class="on">明细</button>
    <button id="tabStats">统计</button>
  </div>

  <!-- 明细 -->
  <div id="listView">
    <div id="records"></div>
  </div>

  <!-- 统计 -->
  <div id="statsView" class="off">
    <div class="panel">
      <h2>本月分类支出</h2>
      <div id="catStats"></div>
    </div>
  </div>

  <div class="tools">
    <button id="btnExport">📤 导出备份</button>
    <button id="btnImport">📥 导入恢复</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>

  <div class="tip">数据只保存在这台设备的浏览器里<br>建议定期点「导出备份」存一份</div>

</div>

<button class="fab" id="fabAdd">＋ 记一笔</button>

<!-- 记账弹层 -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="amt-display" id="amtDisplay"><span class="ph">¥ 0</span></div>
    <div class="cats" id="catChips"></div>
    <input class="note-input" id="noteInput" placeholder="备注（可选，如：午饭、打车）" maxlength="30">
    <div class="pad" id="pad"></div>
    <div class="sheet-row">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-save" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = 'wallet-diary-v1';
  var CATS = [
    ['🍜', '餐饮'], ['🚗', '交通'], ['🛒', '购物'], ['🏠', '居家'],
    ['🎮', '娱乐'], ['💊', '医疗'], ['🎁', '人情'], ['📦', '其他']
  ];
  var CAT_MAP = {};
  CATS.forEach(function (c) { CAT_MAP[c[1]] = c[0]; });

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  var data = load();
  var now = new Date();

  /* ---------- URL 快捷记账：?amt=12.5&cat=餐饮&note=xxx&auto=1 ---------- */
  (function handleUrlParams() {
    var q = new URLSearchParams(location.search);
    var amt = parseFloat(q.get('amt'));
    if (!(amt > 0)) return;
    var cat = q.get('cat');
    if (!CAT_MAP[cat]) cat = '餐饮';
    var note = (q.get('note') || '').slice(0, 30);
    if (q.get('auto') === '1') {
      addRecord(amt, cat, note);
      setTimeout(function () { showToast('已记一笔 ¥' + fmt(amt) + ' · ' + cat); }, 400);
    } else {
      setTimeout(function () { openSheet(amt, cat, note); }, 300);
    }
  })();

  /* ---------- 工具 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(n) {
    n = Math.round(n * 100) / 100;
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function dkey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function addRecord(amt, cat, note) {
    data.push({ id: Date.now() + '' + Math.floor(Math.random() * 1e4), ts: Date.now(), amt: amt, cat: cat, note: note || '' });
    save();
    renderAll();
  }

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg, undoFn) {
    toastEl.innerHTML = '';
    toastEl.appendChild(document.createTextNode(msg));
    if (undoFn) {
      var u = document.createElement('span');
      u.className = 'undo';
      u.textContent = '撤销';
      u.addEventListener('click', function () { undoFn(); hideToast(); });
      toastEl.appendChild(u);
    }
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4000);
  }
  function hideToast() { toastEl.classList.remove('on'); }

  /* ---------- 顶部 ---------- */
  function renderTop() {
    document.getElementById('todayPill').textContent =
      (now.getMonth() + 1) + '月' + now.getDate() + '日 周' + '日一二三四五六'[now.getDay()];
    var mSum = 0, mCnt = 0, tSum = 0, tCnt = 0;
    var today = dkey(Date.now());
    var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    data.forEach(function (r) {
      var d = new Date(r.ts);
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) {
        mSum += r.amt; mCnt++;
        if (dkey(r.ts) === today) { tSum += r.amt; tCnt++; }
      }
    });
    document.getElementById('monthAmt').innerHTML = '<small>¥</small>' + fmt(mSum);
    document.getElementById('todayAmt').textContent = '¥' + fmt(tSum);
    document.getElementById('monthCnt').textContent = mCnt;
    document.getElementById('dayAvg').textContent = '¥' + fmt(mCnt ? mSum / Math.min(dim, now.getDate()) : 0);
  }

  /* ---------- 明细列表 ---------- */
  function renderList() {
    var wrap = document.getElementById('records');
    wrap.innerHTML = '';
    if (!data.length) {
      wrap.innerHTML = '<div class="empty">还没有记录<br>点下面的「＋ 记一笔」开始记账</div>';
      return;
    }
    var sorted = data.slice().sort(function (a, b) { return b.ts - a.ts; });
    var groups = [];
    var lastKey = null;
    sorted.forEach(function (r) {
      var k = dkey(r.ts);
      if (k !== lastKey) { groups.push({ key: k, items: [] }); lastKey = k; }
      groups[groups.length - 1].items.push(r);
    });
    groups.forEach(function (g) {
      var sum = g.items.reduce(function (s, r) { return s + r.amt; }, 0);
      var head = document.createElement('div');
      head.className = 'day-head';
      head.innerHTML = '<span>' + g.key + '</span><span>共 <b>¥' + fmt(sum) + '</b></span>';
      wrap.appendChild(head);
      g.items.forEach(function (r) {
        var el = document.createElement('div');
        el.className = 'rec';
        el.innerHTML =
          '<div class="emoji">' + (CAT_MAP[r.cat] || '📦') + '</div>' +
          '<div class="mid"><div class="cat"></div><div class="note"></div></div>' +
          '<div class="amt">-¥' + fmt(r.amt) + '</div>' +
          '<button class="del" aria-label="删除">✕</button>';
        el.querySelector('.cat').textContent = r.cat;
        var noteEl = el.querySelector('.note');
        var d = new Date(r.ts);
        noteEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + (r.note ? ' · ' + r.note : '');
        el.querySelector('.del').addEventListener('click', function () {
          el.classList.add('gone');
          var idx = -1;
          for (var i = 0; i < data.length; i++) if (data[i].id === r.id) { idx = i; break; }
          if (idx >= 0) {
            var removed = data.splice(idx, 1)[0];
            save();
            setTimeout(function () {
              renderAll();
              showToast('已删除 ¥' + fmt(removed.amt), function () {
                data.push(removed);
                save();
                renderAll();
              });
            }, 200);
          }
        });
        wrap.appendChild(el);
      });
    });
  }

  /* ---------- 统计 ---------- */
  function renderStats() {
    var wrap = document.getElementById('catStats');
    wrap.innerHTML = '';
    var sums = {}, max = 0, total = 0;
    data.forEach(function (r) {
      var d = new Date(r.ts);
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) {
        sums[r.cat] = (sums[r.cat] || 0) + r.amt;
        total += r.amt;
        if (sums[r.cat] > max) max = sums[r.cat];
      }
    });
    var rows = Object.keys(sums).sort(function (a, b) { return sums[b] - sums[a]; });
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">这个月还没花钱<br>或者还没记 😄</div>';
      return;
    }
    rows.forEach(function (cat, i) {
      var row = document.createElement('div');
      row.className = 'cat-row' + (i === 0 ? ' top1' : '');
      var pct = total ? Math.round(sums[cat] / total * 100) : 0;
      row.innerHTML =
        '<div class="emoji">' + (CAT_MAP[cat] || '📦') + '</div>' +
        '<div class="info">' +
          '<div class="top"><span></span><span>¥' + fmt(sums[cat]) + ' · ' + pct + '%</span></div>' +
          '<div class="track"><i style="width:' + (max ? Math.max(sums[cat] / max * 100, 4) : 0) + '%"></i></div>' +
        '</div>';
      row.querySelector('.top span:first-child').textContent = cat;
      wrap.appendChild(row);
    });
  }

  function renderAll() { renderTop(); renderList(); renderStats(); }

  /* ---------- 记账弹层 ---------- */
  var overlay = document.getElementById('overlay');
  var amtStr = '';
  var selCat = '餐饮';

  function buildChips() {
    var wrap = document.getElementById('catChips');
    wrap.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = c[0] + ' ' + c[1];
      if (c[1] === selCat) b.classList.add('on');
      b.addEventListener('click', function () {
        selCat = c[1];
        [...wrap.children].forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
      wrap.appendChild(b);
    });
  }

  function buildPad() {
    var wrap = document.getElementById('pad');
    ['1','2','3','4','5','6','7','8','9','.','0','⌫'].forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = k;
      if (k === '⌫') b.className = 'fn';
      b.addEventListener('click', function () {
        if (k === '⌫') { amtStr = amtStr.slice(0, -1); }
        else if (k === '.') { if (amtStr.indexOf('.') === -1 && amtStr.length) amtStr += '.'; }
        else {
          if (amtStr.replace('.', '').length >= 7) return;
          if (amtStr.indexOf('.') >= 0 && amtStr.split('.')[1].length >= 2) return;
          amtStr += k;
        }
        renderAmt();
      });
      wrap.appendChild(b);
    });
  }

  function renderAmt() {
    var el = document.getElementById('amtDisplay');
    if (!amtStr) { el.innerHTML = '<span class="ph">¥ 0</span>'; return; }
    el.innerHTML = '<small>¥</small>' + amtStr;
  }

  function openSheet(amt, cat, note) {
    amtStr = amt ? String(amt) : '';
    selCat = (cat && CAT_MAP[cat]) ? cat : '餐饮';
    buildChips();
    document.getElementById('noteInput').value = note || '';
    renderAmt();
    overlay.classList.add('on');
  }
  function closeSheet() {
    overlay.classList.remove('on');
    amtStr = '';
    document.getElementById('noteInput').value = '';
  }

  document.getElementById('fabAdd').addEventListener('click', function () { openSheet(); });
  document.getElementById('btnCancel').addEventListener('click', closeSheet);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });

  document.getElementById('btnSave').addEventListener('click', function () {
    var amt = parseFloat(amtStr);
    if (!(amt > 0)) { showToast('先输入金额哦'); return; }
    var note = document.getElementById('noteInput').value.trim();
    addRecord(amt, selCat, note);
    closeSheet();
    showToast('已记 ¥' + fmt(amt) + ' · ' + selCat);
  });

  /* ---------- 页签 ---------- */
  var tabList = document.getElementById('tabList');
  var tabStats = document.getElementById('tabStats');
  var listView = document.getElementById('listView');
  var statsView = document.getElementById('statsView');
  tabList.addEventListener('click', function () {
    tabList.classList.add('on'); tabStats.classList.remove('on');
    listView.classList.remove('off'); statsView.classList.add('off');
  });
  tabStats.addEventListener('click', function () {
    tabStats.classList.add('on'); tabList.classList.remove('on');
    statsView.classList.remove('off'); listView.classList.add('off');
    renderStats();
  });

  /* ---------- 导出 / 导入 ---------- */
  document.getElementById('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '荷包日记备份-' + dkey(Date.now()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    showToast('已导出 ' + data.length + ' 条记录');
  });
  document.getElementById('btnImport').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var arr = JSON.parse(reader.result);
        if (!Array.isArray(arr)) throw new Error('bad');
        var ids = {};
        data.forEach(function (r) { ids[r.id] = 1; });
        var added = 0;
        arr.forEach(function (r) {
          if (r && typeof r.amt === 'number' && r.ts && !ids[r.id]) {
            data.push({ id: r.id || Date.now() + '' + added, ts: r.ts, amt: r.amt, cat: CAT_MAP[r.cat] ? r.cat : '其他', note: String(r.note || '').slice(0, 30) });
            added++;
          }
        });
        save();
        renderAll();
        showToast('导入完成，新增 ' + added + ' 条');
      } catch (err) {
        showToast('文件格式不对，导入失败');
      }
      e.target.value = '';
    };
    reader.readAsText(f);
  });

  buildPad();
  renderAll();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
